services:
  # 1. OpenSearch (SIEM Alert Source & Log Repository)
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: soc-opensearch
    environment:
      - cluster.name=soc-cluster
      - node.name=soc-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - DISABLE_SECURITY_PLUGIN=true # Simplifies local dev API calls without SSL/Auth complexity
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  # 2. Ollama (Local LLM Server)
  ollama:
    image: ollama/ollama:latest
    container_name: soc-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: always

  # 3. PostgreSQL (Structured Storage for Cases and Reports)
  postgres:
    image: postgres:16-alpine
    container_name: soc-postgres
    environment:
      POSTGRES_DB: soc_copilot
      POSTGRES_USER: soc_user
      POSTGRES_PASSWORD: soc_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  opensearch-data:
  ollama-data:
  postgres-data:
