name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Smoke-check the MCP server wiring
        # Cheap, fast check that every tool module the server imports (and the
        # server itself) is still wired up correctly - catches import/wiring
        # regressions that wouldn't otherwise be exercised unless a test happens
        # to exercise that exact code path.
        run: python -c "from src.mcp.mcp_server import SamiGPTMCPServer"

      - name: Cache MITRE ATT&CK dataset
        # AttackMapper downloads the ~49MB Enterprise ATT&CK STIX bundle on
        # first use (it's gitignored, not committed). Caching it keeps CI fast
        # and avoids depending on github.com/mitre/cti being reachable/fast on
        # every single run.
        uses: actions/cache@v4
        with:
          path: data/attack
          key: attack-dataset-v1

      - name: Run test suite with coverage
        # Informational only (no --cov-fail-under): the codebase is at ~16%
        # coverage today, so enforcing a minimum now would just make every PR
        # red regardless of what changed - same trap as the pre-existing test
        # failures and the first ruff pass. This makes the number visible so
        # it can be tracked over time; revisit enforcing a threshold (ideally
        # on changed lines only, not the whole repo) once it's being watched.
        run: pytest tests/ -v --cov=src --cov-report=term-missing

      - name: Add coverage summary
        # Surfaces the coverage % on the run's Summary tab (one click from the
        # check, rendered as markdown) instead of leaving it buried inside the
        # previous step's raw log output. Runs even if tests failed, so
        # coverage is still visible on a red run.
        if: always()
        run: |
          {
            echo "## Test Coverage"
            echo ""
            echo "**Total: $(coverage report --format=total)%**"
            echo ""
            echo "<details><summary>Per-file breakdown</summary>"
            echo ""
            coverage report --format=markdown
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install ruff
        run: pip install -r requirements-dev.txt

      - name: Run ruff
        # Rule selection and the (small, documented) set of ignored rules and
        # per-line `# noqa` exceptions live in pyproject.toml.
        run: ruff check src/ tests/
