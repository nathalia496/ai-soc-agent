name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    # Explicit, least-privilege permissions for this job's GITHUB_TOKEN:
    # contents:read to check out the repo, checks:write so the coverage step
    # below can create its own check run via the GitHub API. Setting this
    # block overrides the org/repo default for this job, so both need to be
    # listed even though only `checks` is new.
    permissions:
      contents: read
      checks: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Smoke-check the MCP server wiring
        # Cheap, fast check that every tool module the server imports (and the
        # server itself) is still wired up correctly - catches import/wiring
        # regressions that wouldn't otherwise be exercised unless a test happens
        # to exercise that exact code path.
        run: python -c "from src.mcp.mcp_server import AttackLensMCPServer"

      - name: Cache MITRE ATT&CK dataset
        # AttackMapper downloads the ~49MB Enterprise ATT&CK STIX bundle on
        # first use (it's gitignored, not committed). Caching it keeps CI fast
        # and avoids depending on github.com/mitre/cti being reachable/fast on
        # every single run.
        uses: actions/cache@v4
        with:
          path: data/attack
          key: attack-dataset-v1

      - name: Run test suite with coverage
        # Informational only (no --cov-fail-under): the codebase is at ~16%
        # coverage today, so enforcing a minimum now would just make every PR
        # red regardless of what changed - same trap as the pre-existing test
        # failures and the first ruff pass. This makes the number visible so
        # it can be tracked over time; revisit enforcing a threshold (ideally
        # on changed lines only, not the whole repo) once it's being watched.
        run: pytest tests/ -v --cov=src --cov-report=term-missing

      - name: Publish coverage as its own check
        # Creates a standalone "Coverage" entry in the PR's checks list (like
        # `coverage/js` in other stacks) with the % visible right in the
        # check's title, via the GitHub Checks API. Uses actions/github-script
        # (official, GitHub-maintained, already trusted the same as
        # actions/checkout) instead of a third-party coverage service like
        # Codecov: Codecov's own uploader was compromised in a real
        # supply-chain incident in 2021 (it exfiltrated CI secrets for
        # months before being caught), and this project should not be adding
        # that class of external dependency to its own CI just to render a
        # number. Informational only: conclusion is always "success", so it
        # never blocks merging on its own. Runs even if tests failed, so
        # coverage is still visible on a red run.
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require("child_process");
            const total = execSync("coverage report --format=total").toString().trim();
            const table = execSync("coverage report --format=markdown").toString().trim();
            const headSha = context.payload.pull_request?.head.sha ?? context.sha;

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "Coverage",
              head_sha: headSha,
              status: "completed",
              conclusion: "success",
              output: {
                title: `${total}% statement coverage`,
                summary: `**Total: ${total}%** of statements in \`src/\` are covered by tests.\n\n` +
                  `<details><summary>Per-file breakdown</summary>\n\n${table}\n\n</details>`,
              },
            });

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install ruff
        run: pip install -r requirements-dev.txt

      - name: Run ruff
        # Rule selection and the (small, documented) set of ignored rules and
        # per-line `# noqa` exceptions live in pyproject.toml.
        run: ruff check src/ tests/
