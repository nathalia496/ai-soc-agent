name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Smoke-check the MCP server wiring
        # Cheap, fast check that every tool module the server imports (and the
        # server itself) is still wired up correctly - catches import/wiring
        # regressions that wouldn't otherwise be exercised unless a test happens
        # to exercise that exact code path.
        run: python -c "from src.mcp.mcp_server import SamiGPTMCPServer"

      - name: Cache MITRE ATT&CK dataset
        # AttackMapper downloads the ~49MB Enterprise ATT&CK STIX bundle on
        # first use (it's gitignored, not committed). Caching it keeps CI fast
        # and avoids depending on github.com/mitre/cti being reachable/fast on
        # every single run.
        uses: actions/cache@v4
        with:
          path: data/attack
          key: attack-dataset-v1

      - name: Run test suite
        run: pytest tests/ -v
